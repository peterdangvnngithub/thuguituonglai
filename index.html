<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư Gửi Tới Tương Lai</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="vendor/glightbox/glightbox.min.css">
</head>
<body>

  <div id="envelope-overlay">
    <div class="envelope-container">
      <div class="envelope">
        <div class="envelope-flap"></div>
        <div class="envelope-seal"></div>
      </div>
      <div class="envelope-text">CHẠM ĐỂ MỞ THƯ</div>
    </div>
  </div>

  <div class="container" id="main-content">

    <header class="reveal">
      <h1>THƯ GỬI TỚI TƯƠNG LAI</h1>
      <p>Gieo mầm tri thức — Vững bước tương lai cùng Pétrus Ký</p>
    </header>

    <div class="audio-wrapper reveal">
      <label>Âm thanh lời nhắn</label>
      <audio id="player" controls></audio>
      <p id="audio-hint" class="empty-hint" hidden>Thêm file audio/audio.mp3 (hoặc wav, m4a, ogg).</p>
    </div>

    <div class="section-block reveal">
      <div class="col-letter">
        <div class="section-title">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Bức thư (Phần 1)
        </div>
        <div id="letter-1"></div>
      </div>

      <div class="col-gallery">
        <div class="section-title">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Hình ảnh thực tế dạy học
        </div>
        <div id="gallery-1"></div>
      </div>
    </div>

    <div class="time-divider reveal">
      <span>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Thời gian tiếp nối
      </span>
    </div>

    <div class="section-block section-future reveal">
      <div class="col-letter">
        <div class="section-title">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Bức thư (Phần tiếp theo)
        </div>
        <div id="letter-2"></div>
      </div>

      <div class="col-gallery">
        <div class="section-title">
          <svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          Bục giảng tương lai
        </div>
        <div id="gallery-2"></div>
      </div>
    </div>

    <footer class="reveal">
      <p>Viết cho ngày mai</p>
    </footer>

  </div>

  <script src="vendor/glightbox/glightbox.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
